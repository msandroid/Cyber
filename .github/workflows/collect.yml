name: collect

on:
  schedule:
    - cron: "17 21,9 * * *"   # 毎日 06:17 / 18:17 (JST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Collect
        run: python collector/collect.py collect
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: collect $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
